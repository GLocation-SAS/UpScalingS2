<!doctype html>
<html lang="es" class="">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/img/Favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UpScalingS2</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <!-- <link rel="stylesheet" href="/css/input.css"> -->
  <!-- <link rel="stylesheet" href="/css/style.css"> -->
  <link rel="stylesheet" href="/css/output.css">
</head>

<body
  class="relative bg-slate-200 dark:bg-primary/50 min-h-screen flex flex-col transition-colors duration-300 overflow-x-hidden">
  <!-- Fondo  -->
  <div class="absolute inset-0 z-0 pointer-events-none opacity-20 dark:opacity-30">
    <div
      class="absolute inset-0 bg-[radial-gradient(#1f618c_1px,transparent_1px)] [background-size:40px_40px] dark:bg-[radial-gradient(#65a7db_1px,transparent_1px)] [background-size:40px_40px]">
    </div>
    <div class="absolute top-20 left-[10%] text-primary animate-float" style="animation-delay: 0s;">
      <span class="material-icons-round text-8xl">satellite_alt</span>
    </div>
    <div class="absolute bottom-20 left-[15%] text-secondary animate-drift" style="animation-delay: 1s;">
      <span class="material-icons-round text-7xl">location_on</span>
    </div>
    <div class="absolute top-1/4 right-[10%] text-accent animate-float" style="animation-delay: 2s;">
      <span class="material-icons-round text-9xl rotate-45">search</span>
    </div>
    <div class="absolute bottom-1/4 right-[15%] text-tertiary opacity-50 animate-drift" style="animation-delay: 0.5s;">
      <span class="material-icons-round text-8xl">travel_explore</span>
    </div>
    <svg class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full min-w-[1000px] min-h-[1000px]"
      viewBox="0 0 1000 1000" aria-hidden="true">
      <circle class="text-primary/20" cx="500" cy="500" fill="none" r="300" stroke="currentColor"
        stroke-dasharray="10 20" stroke-width="1"></circle>
      <circle class="text-secondary/20" cx="500" cy="500" fill="none" r="450" stroke="currentColor"
        stroke-dasharray="5 15" stroke-width="1"></circle>
    </svg>
  </div>

  <header class="relative z-10 p-6 flex justify-between items-center w-full max-w-7xl mx-auto">
    <div class="flex items-center gap-2 group cursor-pointer relative">
      <img src="/public/img/Logo_Horizontal.png" alt="UpScalingS2" class="w-36 h-12 dark:hidden" />
      <img src="/public/img/Logo_Horizonal_Blanco.png" alt="UpScalingS2" class="w-36 h-12 hidden dark:block" />
    </div>
    <button class="p-2 flex rounded-full text-primary px-5  bg-secondary/30 dark:text-white transition-colors"
      onclick="document.documentElement.classList.toggle('dark')">
      <span class="material-icons-round">dark_mode</span>
    </button>
  </header>

  <!-- Vista de carga de archivo -->
  <main id="view-landing" class="relative z-10 flex-grow flex flex-col items-center justify-center px-4 py-12">
    <div
      class="bg-primary/10 dark:bg-white/5 p-4 sm:p-8 md:p-20 rounded-3xl md:rounded-[3rem] w-full max-w-4xl shadow-sm border border-secondary/20 dark:border-white/10 transition-all">
      <div class="text-center space-y-12 max-w-2xl mx-auto">
        <div class="space-y-6">
          <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter inline-block">
            <span class="text-primary dark:text-white">UpScaling</span><span class="logo-s2-color">S2</span>
          </h1>
          <p class="text-primary dark:text-white/80 text-lg md:text-xl font-medium pt-4 max-w-md mx-auto">
            Sistema de mejora para composiciones de Sentinel-2 potenciado por IA.
          </p>
        </div>
        <div class="flex flex-col items-center gap-6 pt-6">
          <label class="group relative w-full sm:w-80 cursor-pointer" for="file-upload">
            <div
              class="absolute -inset-1 bg-accent/20 rounded-2xl blur opacity-0 group-hover:opacity-100 transition duration-300">
            </div>
            <div
              class="px-6 py-4 bg-primary dark:bg-primary border-2 border-primary dark:border-primary rounded-xl flex items-center justify-center gap-3 transition-all transform hover:shadow-sm hover:shadow-primary">
              <span class="material-icons-round text-white">cloud_upload</span>
              <span class="text-white text-2xl font-bold">Cargar archivo</span>
            </div>
            <input class="hidden" id="file-upload" type="file" accept="image/*" />
          </label>
          <div class="flex items-center gap-4 w-full max-w-[200px]">
            <div class="h-px flex-grow bg-secondary/30 dark:bg-white/20"></div>
            <span class="text-primary dark:text-white/40 font-medium italic">ó</span>
            <div class="h-px flex-grow bg-secondary/30 dark:bg-white/20"></div>
          </div>
          <button
            class="w-full sm:w-80 px-6 py-4 bg-transparent border-2 border-secondary/80 dark:border-white/30 rounded-xl text-secondary dark:text-white/90 hover:bg-secondary/20 hover:border-secondary/100  dark:hover:bg-white/5 transition-all flex items-center justify-center gap-2 group">
            <span class="material-icons-round text-secondary group-hover:text-secondary transition-colors">link</span>
            <span class="text-lg font-bold">Pega la ruta GSUtil</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Vista de mapa -->
  <main id="view-iframe" class="relative z-10 flex-grow flex flex-col w-full px-4 py-8 hidden">
    <div
      class="bg-primary/10 dark:bg-white/5 p-4 rounded-3xl w-full shadow-sm border border-secondary/20 dark:border-white/10 transition-all flex flex-col flex-1 min-h-0">
      <div class="flex gap-4 flex-col md:flex-row justify-between mb-4">
        <div class="flex gap-2 justify-between md:align-baseline mt-2.5">
          <button type="button" id="btn-back"
            class="h-[45px] p-2 rounded-lg text-primary bg-secondary/80 dark:bg-white/80 hover:bg-secondary/90 dark:hover:bg-white/90 transition-colors flex items-center gap-2">
            <span class="material-icons-round">arrow_back</span>
          </button>
          <button type="button" id="btn-view-comparative"
            class="h-[45px] p-2 rounded-lg text-primary bg-secondary/80 dark:bg-white/80 hover:bg-secondary/90 dark:hover:bg-white/90 transition-colors flex items-center gap-2">Vista
            comparativa</button>
        </div>
        <div class="flex flex-col">
          <span class="text-primary dark:text-white">Descargar</span>
          <div class="flex gap-2">
            <button type="button" id="btn-download-png"
              class="py-1 px-2 rounded-lg text-white bg-primary  transition-colors flex items-center gap-2">.PNG</button>
            <button type="button" id="btn-download-png"
              class="py-1 px-2 rounded-lg text-white bg-accent transition-colors flex items-center gap-2">.JPEG</button>
            <button type="button" id="btn-download-tif"
              class="py-1 px-2 rounded-lg text-white bg-tertiary transition-colors flex items-center gap-2">.TIF</button>
          </div>
        </div>

      </div>
      <iframe id="file-iframe"
        class="w-full flex-1 min-h-[60vh] rounded-xl border border-secondary/20 dark:border-white/10 bg-white dark:bg-black/20"
        title="Archivo cargado"></iframe>
    </div>
  </main>
  <footer class="relative z-10 p-8 text-center text-primary dark:text-white/40 text-sm">
    <div class="flex flex-wrap justify-center gap-6 mb-4">
      <a class="text-primary dark:text-white hover:text-accent dark:hover:text-accent transition-colors font-semibold"
        href="#">Términos de
        servicio</a>
      <a class="text-primary dark:text-white hover:text-accent dark:hover:text-accent transition-colors font-semibold"
        href="#">Documentación API</a>
      <a class="text-primary dark:text-white hover:text-accent dark:hover:text-accent transition-colors font-semibold"
        href="#">Contacto</a>
    </div>
    <p>© 2024 UpScalingS2. Powered by Advanced Satellite Super-Resolution AI.</p>
  </footer>






  <script type="module" src="/js/main.js"></script>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
</body>

</html>
